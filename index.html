<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Portofolio - Aziz Maghfuri</title>
		<style>
			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background-color: #0f172a;
				color: #f8fafc;
				margin: 0;
				padding: 20px;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 90vh;
			}
			
			.card {
				background-color: #1e293b;
				padding: 30px;
				border-radius: 12px;
				box-shadow: 0 10px 25px rgba(0,0,0,0.5);
				max-width: 400px;
				border: 1px solid #334155;
			}

			h1 {
				color: #38bdf8;
				margin-top: 0;
				font-size: 24px;
			}

			p {
				color: #cbd5e1;
				line-height: 1.6;
				font-size: 15px;
			}

			.badge {
				display: inline-block;
				background-color: #0369a1;
				color: #ffffff;
				padding: 4px 12px;
				border-radius: 20px;
				font-size: 12px;
				font-weight: bold;
				margin-top: 10px;
			}

			.btn {
				display: block;
				width: 100%;
				text-align: center;
				background-color: #0284c7;
				color: white;
				padding: 12px 0;
				margin-top: 20px;
				border-radius: 8px;
				text-decoration: none;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Halo, Saya Aziz Maghfuri 👋</h1>
			<p>Saya lulusan SMK Batik Perbaik Purworejo jurusan Rekayasa Perangkat Lunak (RPL). Fokus pada pembuatan aplikasi web responsif, pengelolaan basis data (database), dan penulisan kode yang rapi serta terstruktur.</p>
			<span class="badge">Open for Freelance / Work</span>
			<a href="https://github.com/azizmaghfuri" class="btn">Lihat GitHub Saya</a>
		</div>
	</body>
</html>
